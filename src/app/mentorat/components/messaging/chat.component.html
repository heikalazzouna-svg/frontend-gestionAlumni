<div class="chat-container">
  <div class="chat-header">
    <h2>Messagerie Directe</h2>
  </div>
  
  <div class="message-list" #scrollMe [scrollTop]="scrollMe.scrollHeight">
    <div *ngFor="let msg of messages" [class.own-message]="msg.sender.id === currentUser?.id" class="message-wrapper">
      <div class="message-content">
        <p>{{ msg.content }}</p>
        <span class="time">{{ msg.sentDate | date:'HH:mm' }}</span>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Votre message...">
    <button (click)="sendMessage()" class="btn-send"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>
