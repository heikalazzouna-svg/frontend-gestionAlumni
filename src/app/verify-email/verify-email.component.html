<div class="auth-page">
  <div class="auth-right" style="width: 100%;">
    <div class="auth-form-wrapper" style="text-align: center;">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="auth-form-header">
        <div style="font-size: 4rem; color: #596a7b; margin-bottom: 1rem;">
          <i class="fa fa-spinner fa-spin"></i>
        </div>
        <h1>Vérification en cours...</h1>
        <p>Veuillez patienter pendant que nous validons votre compte.</p>
      </div>

      <!-- Success State -->
      <div *ngIf="!isLoading && isSuccess" class="auth-form-header">
        <div style="font-size: 4rem; color: #00d289; margin-bottom: 1rem;">
          <i class="fa fa-check-circle"></i>
        </div>
        <h1>Compte vérifié !</h1>
        <p style="font-size: 1.1rem; line-height: 1.6; margin: 1.5rem 0;">
          Votre adresse e-mail a été confirmée avec succès. <br>
          Vous pouvez maintenant vous connecter à votre compte.
        </p>
        <a routerLink="/login" class="submit-btn" style="display: inline-block; padding: 12px 30px; background: #00d289; color: white; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1.1rem; margin-top: 1rem;">
          Se connecter
        </a>
      </div>

      <!-- Error State -->
      <div *ngIf="!isLoading && !isSuccess" class="auth-form-header">
        <div style="font-size: 4rem; color: #e74c3c; margin-bottom: 1rem;">
          <i class="fa fa-times-circle"></i>
        </div>
        <h1>Échec de la vérification</h1>
        <p style="font-size: 1.1rem; color: #e74c3c; background: #fdf3f2; padding: 15px; border-radius: 8px; margin: 1.5rem 0;">
          {{ errorMessage }}
        </p>
        <div class="auth-footer" style="margin-top: 2rem;">
          <p><a routerLink="/sign-up"><i class="fa fa-arrow-left"></i> Retour à l'inscription</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
