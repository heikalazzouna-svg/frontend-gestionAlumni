<div class="dashboard-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <a routerLink="/" class="sidebar-brand" *ngIf="!isSidebarCollapsed">
        <span class="brand-icon">&#9670;</span>
        <span>Edu<span class="accent">Link</span></span>
      </a>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="fas" [class.fa-chevron-left]="!isSidebarCollapsed" [class.fa-chevron-right]="isSidebarCollapsed"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/alumni/home" routerLinkActive="active" class="nav-item">
        <i class="fas fa-th-large"></i>
        <span *ngIf="!isSidebarCollapsed">Tableau de bord</span>
      </a>
      <a routerLink="/alumni/events" routerLinkActive="active" class="nav-item">
        <i class="fas fa-calendar-alt"></i>
        <span *ngIf="!isSidebarCollapsed">Événements</span>
      </a>
      <a routerLink="/alumni/directory" routerLinkActive="active" class="nav-item">
        <i class="fas fa-users"></i>
        <span *ngIf="!isSidebarCollapsed">Annuaire</span>
      </a>
      <a routerLink="/alumni/ai-simulator" routerLinkActive="active" class="nav-item">
        <i class="fas fa-robot"></i>
        <span *ngIf="!isSidebarCollapsed">Simulateur IA</span>
      </a>

      <div class="nav-separator" *ngIf="!isSidebarCollapsed">Communauté</div>

      <a routerLink="/alumni/mentorat/experience" routerLinkActive="active" class="nav-item">
        <i class="fas fa-heart"></i>
        <span *ngIf="!isSidebarCollapsed">Partager Expérience</span>
      </a>
      <a routerLink="/alumni/mentorat/tracking" routerLinkActive="active" class="nav-item">
        <i class="fas fa-user-graduate"></i>
        <span *ngIf="!isSidebarCollapsed">Mes Mentorés</span>
      </a>
      <a routerLink="/alumni/messaging" routerLinkActive="active" class="nav-item">
        <i class="fas fa-envelope"></i>
        <span *ngIf="!isSidebarCollapsed">Messagerie</span>
        <span class="notif-badge" *ngIf="notifService.counts.messages > 0">{{ notifService.counts.messages }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" *ngIf="!isSidebarCollapsed">
        <div class="user-avatar alumni">
          <img *ngIf="currentUser?.avatarUrl" [src]="currentUser?.avatarUrl" [alt]="currentUser?.firstName" class="sidebar-avatar-img" />
          <span *ngIf="!currentUser?.avatarUrl">{{ currentUser?.firstName?.charAt(0) }}{{ currentUser?.lastName?.charAt(0) }}</span>
        </div>
        <div class="user-details">
          <p class="user-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</p>
          <p class="user-role">Alumni</p>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span *ngIf="!isSidebarCollapsed">Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-header">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Rechercher des étudiants, des projets...">
      </div>
      <app-user-menu
        [user]="currentUser"
        [notificationCount]="notifService.counts.messages">
      </app-user-menu>
    </header>

    <section class="content-area">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
